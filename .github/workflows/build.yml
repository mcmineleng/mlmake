name: 构建

on:
  workflow_dispatch:
    inputs:
      macos_aarch64: {type: boolean, default: false, description: "macOS aarch64"}
      macos_x86_64:  {type: boolean, default: false, description: "macOS x86_64"}

      linux_x86_64:  {type: boolean, default: true,  description: "Linux x86_64"}
      linux_aarch64: {type: boolean, default: false, description: "Linux aarch64"}
      linux_armv7:   {type: boolean, default: false, description: "Linux armv7"}
      linux_x86:     {type: boolean, default: false, description: "Linux x86"}

      bsd_x86_64:    {type: boolean, default: false, description: "BSD x86_64"}
      bsd_aarch64:   {type: boolean, default: false, description: "BSD aarch64"}
      bsd_x86:       {type: boolean, default: false, description: "BSD x86"}

      and_x86_64:    {type: boolean, default: false, description: "Android x86_64"}
      and_aarch64:   {type: boolean, default: false, description: "Android aarch64"}
      and_armv7:     {type: boolean, default: false, description: "Android armv7"}
      and_x86:       {type: boolean, default: false, description: "Android x86"}

env:
  ANDROID_NDK_VERSION: r27c
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # ===================== Unix-like =====================
  Unix-like:
    if: >-
      ${{ inputs.linux_x86_64 || inputs.linux_aarch64 || inputs.linux_armv7 || inputs.linux_x86 ||
          inputs.bsd_x86_64 || inputs.bsd_aarch64 || inputs.bsd_x86 ||
          inputs.and_x86_64 || inputs.and_aarch64 || inputs.and_armv7 || inputs.and_x86 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Zig（BSD 交叉用）
        if: ${{ inputs.bsd_x86_64 || inputs.bsd_aarch64 || inputs.bsd_x86 }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 NDK（Android 用）
        if: ${{ inputs.and_x86_64 || inputs.and_aarch64 || inputs.and_armv7 || inputs.and_x86 }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: 安装 cargo-ndk
        if: ${{ inputs.and_x86_64 || inputs.and_aarch64 || inputs.and_armv7 || inputs.and_x86 }}
        run: cargo install cargo-ndk --version 3.5.5 --locked

      - name: 读包名
        id: pkg
        run: |
          BIN=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^name[[:space:]]*=/{v=$0;sub(/^name[[:space:]]*=[[:space:]]*/,"",v);gsub(/[" \r]/,"",v);print v;exit}' Cargo.toml)
          [ -z "$BIN" ] && { echo "::error::Cargo.toml 未找到 [package].name"; exit 1; }
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: 按需装工具链（仅 Linux/BSD，已去 musl）
        run: |
          set -euo pipefail
          I='${{ toJSON(inputs) }}'
          has(){ jq -r "if .$1 == true then \"1\" else \"0\" end" <<<"$I"; }
          PK=""
          [ "$(has linux_aarch64)" = 1 ] || [ "$(has linux_armv7)" = 1 ] && PK="$PK gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf"
          [ "$(has linux_x86)" = 1 ] && PK="$PK gcc-i686-linux-gnu"

          rm -f /tmp/tgt.txt
          [ "$(has linux_aarch64)" = 1 ] && echo aarch64-unknown-linux-gnu >> /tmp/tgt.txt
          [ "$(has linux_armv7)"  = 1 ] && echo armv7-unknown-linux-gnueabihf >> /tmp/tgt.txt
          [ "$(has linux_x86)"    = 1 ] && echo i686-unknown-linux-gnu >> /tmp/tgt.txt
          [ "$(has bsd_x86_64)"   = 1 ] && echo x86_64-unknown-freebsd >> /tmp/tgt.txt
          [ "$(has bsd_aarch64)"  = 1 ] && echo aarch64-unknown-freebsd >> /tmp/tgt.txt
          [ "$(has bsd_x86)"      = 1 ] && echo i686-unknown-freebsd >> /tmp/tgt.txt

          # Android rust 目标（NDK 用）
          [ "$(has and_x86_64)"   = 1 ] && echo x86_64-linux-android >> /tmp/tgt.txt
          [ "$(has and_aarch64)"  = 1 ] && echo aarch64-linux-android >> /tmp/tgt.txt
          [ "$(has and_armv7)"    = 1 ] && echo armv7-linux-androideabi >> /tmp/tgt.txt
          [ "$(has and_x86)"      = 1 ] && echo i686-linux-android >> /tmp/tgt.txt

          [ -n "$PK" ] && { sudo apt-get update; sudo apt-get install -y $PK; }
          [ -s /tmp/tgt.txt ] && rustup target add $(tr '\n' ' ' < /tmp/tgt.txt)

      - name: 写 .cargo/config.toml（仅 Linux/BSD，Android 交给 cargo-ndk）
        run: |
          set -euo pipefail
          I='${{ toJSON(inputs) }}'
          has(){ jq -r "if .$1 == true then \"1\" else \"0\" end" <<<"$I"; }
          mkdir -p .cargo
          {
            [ "$(has linux_aarch64)" = 1 ] && { echo '[target.aarch64-unknown-linux-gnu]'; echo 'linker = "aarch64-linux-gnu-gcc"'; }
            [ "$(has linux_armv7)"  = 1 ] && { echo '[target.armv7-unknown-linux-gnueabihf]'; echo 'linker = "arm-linux-gnueabihf-gcc"'; }
            [ "$(has linux_x86)"    = 1 ] && { echo '[target.i686-unknown-linux-gnu]'; echo 'linker = "i686-linux-gnu-gcc"'; }
            [ "$(has bsd_x86_64)"   = 1 ] && { echo '[target.x86_64-unknown-freebsd]'; echo 'linker = "zig"'; echo 'rustflags = ["-C", "link-arg=--target=x86_64-freebsd"]'; }
            [ "$(has bsd_aarch64)"  = 1 ] && { echo '[target.aarch64-unknown-freebsd]'; echo 'linker = "zig"'; echo 'rustflags = ["-C", "link-arg=--target=aarch64-freebsd"]'; }
            [ "$(has bsd_x86)"      = 1 ] && { echo '[target.i686-unknown-freebsd]'; echo 'linker = "zig"'; echo 'rustflags = ["-C", "link-arg=--target=i686-freebsd"]'; }
          } >> .cargo/config.toml
          cat .cargo/config.toml

      - name: 构建 Linux / BSD
        run: |
          set -euo pipefail
          BIN="${{ steps.pkg.outputs.bin }}"
          mkdir -p out
          b(){ local t=$1 n=$2; cargo build --release --target "$t"; cp "target/$t/release/$BIN" "out/$n"; }
          I='${{ toJSON(inputs) }}'
          has(){ jq -r "if .$1 == true then \"1\" else \"0\" end" <<<"$I"; }

          [ "$(has linux_x86_64)"  = 1 ] && b x86_64-unknown-linux-gnu linux-x86_64
          [ "$(has linux_aarch64)" = 1 ] && b aarch64-unknown-linux-gnu linux-aarch64
          [ "$(has linux_armv7)"   = 1 ] && b armv7-unknown-linux-gnueabihf linux-armv7
          [ "$(has linux_x86)"     = 1 ] && b i686-unknown-linux-gnu linux-x86

          [ "$(has bsd_x86_64)"    = 1 ] && b x86_64-unknown-freebsd bsd-x86_64
          [ "$(has bsd_aarch64)"   = 1 ] && b aarch64-unknown-freebsd bsd-aarch64
          [ "$(has bsd_x86)"       = 1 ] && b i686-unknown-freebsd bsd-x86

      - name: 构建 Android（cargo-ndk）
        if: ${{ inputs.and_x86_64 || inputs.and_aarch64 || inputs.and_armv7 || inputs.and_x86 }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          BIN="${{ steps.pkg.outputs.bin }}"
          I='${{ toJSON(inputs) }}'
          has(){ jq -r "if .$1 == true then \"1\" else \"0\" end" <<<"$I"; }

          [ "$(has and_aarch64)" = 1 ] && { cargo ndk -t arm64-v8a  -p 21 build --release --bin "$BIN"; cp "target/aarch64-linux-android/release/$BIN" out/android-aarch64; }
          [ "$(has and_armv7)"   = 1 ] && { cargo ndk -t armeabi-v7a -p 21 build --release --bin "$BIN"; cp "target/armv7-linux-androideabi/release/$BIN" out/android-armv7; }
          [ "$(has and_x86_64)"  = 1 ] && { cargo ndk -t x86_64     -p 21 build --release --bin "$BIN"; cp "target/x86_64-linux-android/release/$BIN" out/android-x86_64; }
          [ "$(has and_x86)"     = 1 ] && { cargo ndk -t x86        -p 21 build --release --bin "$BIN"; cp "target/i686-linux-android/release/$BIN" out/android-x86; }

          ls -la out

      - name: 打包 Unix-like.zip
        run: cd out && zip -r ../Unix-like.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Unix-like
          path: Unix-like.zip

  # ===================== macOS =====================
  macOS:
    if: ${{ inputs.macos_aarch64 || inputs.macos_x86_64 }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: 读包名
        id: pkg
        run: |
          BIN=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^name[[:space:]]*=/{v=$0;sub(/^name[[:space:]]*=[[:space:]]*/,"",v);gsub(/[" \r]/,"",v);print v;exit}' Cargo.toml)
          [ -z "$BIN" ] && { echo "::error::Cargo.toml 未找到 [package].name"; exit 1; }
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: 构建
        run: |
          set -euo pipefail
          BIN="${{ steps.pkg.outputs.bin }}"
          mkdir -p out
          if [ "${{ inputs.macos_x86_64 }}" = "true" ]; then
            cargo build --release --target x86_64-apple-darwin
            cp "target/x86_64-apple-darwin/release/$BIN" out/macos-x86_64
          fi
          if [ "${{ inputs.macos_aarch64 }}" = "true" ]; then
            cargo build --release --target aarch64-apple-darwin
            cp "target/aarch64-apple-darwin/release/$BIN" out/macos-aarch64
          fi
          ls out

      - name: 打包 macOS.zip
        run: cd out && zip -r ../macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: macOS.zip

