name: Cross Build

on:
  workflow_dispatch:
    inputs:
      systems:
        description: 'Target system(s)'
        type: choice
        default: linux
        options: [linux, windows, macos, bsd, android, allsystem]
      archs:
        description: 'Target arch(s)'
        type: choice
        default: x86_64
        options: [x86_64, aarch64, armv7, x86, allarch]

env:
  BIN: myapp   # 改成你的二进制名

jobs:
  # ---------- Linux / Windows / BSD / Android (Linux runner) ----------
  non-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf mingw-w64 zig
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf \
                           x86_64-pc-windows-gnu aarch64-pc-windows-gnu i686-pc-windows-gnu \
                           x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf \
                           i686-unknown-linux-musl \
                           x86_64-unknown-freebsd aarch64-unknown-freebsd i686-unknown-freebsd

      - name: Cargo config
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          [target.aarch64-pc-windows-gnu]
          linker = "aarch64-w64-mingw32-gcc"
          [target.i686-pc-windows-gnu]
          linker = "i686-w64-mingw32-gcc"
          [target.x86_64-unknown-linux-musl]
          linker = "musl-gcc"
          [target.armv7-unknown-linux-musleabihf]
          linker = "arm-linux-gnueabihf-gcc"
          [target.x86_64-unknown-freebsd]
          linker = "zig"
          rustflags = ["-C","link-arg=-target","-C","link-arg=x86_64-freebsd"]
          [target.aarch64-unknown-freebsd]
          linker = "zig"
          rustflags = ["-C","link-arg=-target","-C","link-arg=aarch64-freebsd"]
          [target.i686-unknown-freebsd]
          linker = "zig"
          rustflags = ["-C","link-arg=-target","-C","link-arg=i686-freebsd"]
          EOF

      - name: Build matrix expand
        id: m
        run: |
          SYS="${{ github.event.inputs.systems }}"
          ARCH="${{ github.event.inputs.archs }}"
          [ "$SYS" = "allsystem" ] && SYS="linux windows bsd android"
          [ "$ARCH" = "allarch" ] && ARCH="x86_64 aarch64 armv7 x86"
          echo "sys=$SYS" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          mkdir -p out
          SYS="${{ steps.m.outputs.sys }}"
          ARCH="${{ steps.m.outputs.arch }}"
          for s in $SYS; do
            for a in $ARCH; do
              case "$s-$a" in
                linux-x86_64)   T=x86_64-unknown-linux-gnu;   NAME=linux-x86_64;;
                linux-aarch64)  T=aarch64-unknown-linux-gnu;  NAME=linux-aarch64;;
                linux-armv7)    T=armv7-unknown-linux-gnueabihf; NAME=linux-armv7;;
                linux-x86)      T=i686-unknown-linux-gnu;     NAME=linux-x86;;
                windows-x86_64) T=x86_64-pc-windows-gnu;      NAME=windows-x86_64.exe;;
                windows-aarch64)T=aarch64-pc-windows-gnu;     NAME=windows-aarch64.exe;;
                windows-x86)    T=i686-pc-windows-gnu;        NAME=windows-x86.exe;;
                bsd-x86_64)     T=x86_64-unknown-freebsd;     NAME=bsd-x86_64;;
                bsd-aarch64)    T=aarch64-unknown-freebsd;    NAME=bsd-aarch64;;
                bsd-x86)        T=i686-unknown-freebsd;       NAME=bsd-x86;;
                android-x86_64) T=x86_64-unknown-linux-musl;  NAME=android-x86_64;;
                android-aarch64)T=aarch64-unknown-linux-musl; NAME=android-aarch64;;
                android-x86)    T=i686-unknown-linux-musl;    NAME=android-x86;;
                android-armv7)  T=armv7-unknown-linux-musleabihf; NAME=android-armv7;;
                *) echo "skip $s-$a"; continue;;
              esac
              cargo build --release --target $T
              # 找产物
              SRC="target/$T/release/${{ env.BIN }}"
              [ -f "$SRC.exe" ] && SRC="$SRC.exe"
              cp "$SRC" "out/$NAME"
            done
          done
          ls -la out

      - name: Upload non-macos artifacts
        uses: actions/upload-artifact@v4
        with:
          name: non-macos-bins
          path: out/*

  # ---------- macOS (单独 runner) ----------
  macos:
    runs-on: macos-14   # arm64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build macOS (universal-ish, per arch)
        run: |
          mkdir -p out
          ARCH="${{ github.event.inputs.archs }}"
          [ "$ARCH" = "allarch" ] && ARCH="x86_64 aarch64"
          # macOS 没有 x86/armv7 实用目标，只处理 x86_64/aarch64
          for a in $ARCH; do
            case $a in
              x86_64)  T=x86_64-apple-darwin;  NAME=macos-x86_64;;
              aarch64) T=aarch64-apple-darwin; NAME=macos-aarch64;;
              *) echo "macOS skip $a"; continue;;
            esac
            cargo build --release --target $T
            cp "target/$T/release/${{ env.BIN }}" "out/$NAME"
          done
          ls -la out

      - name: Upload macos artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bins
          path: out/*

  # ---------- 汇总打包 ----------
  bundle:
    needs: [non-macos, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: allbins
      - name: Flatten & zip
        run: |
          mkdir -p dist
          find allbins -type f -exec cp {} dist/ \;
          cd dist
          ls -la
          zip -r ../builds-${{ github.run_number }}.zip .
      - name: Upload final zip
        uses: actions/upload-artifact@v4
        with:
          name: all-builds
          path: builds-${{ github.run_number }}.zip

