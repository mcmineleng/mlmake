[settings]
actioninfo = true

# ============================================================
#  探测（内部，静默）：把 [package].name 读进 BIN 并写入全局池
# ============================================================
[[task]]
name = "探测包名"
value = "probe"
cmduse = false
[task.settings]
actioninfo = false

[[task.step]]
name = "读取包名"
[[task.step.action]]
run = '''
BIN=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^name[[:space:]]*=/{
  v=$0; sub(/^name[[:space:]]*=[[:space:]]*/,"",v); gsub(/[" \r]/,"",v); print v; exit }' Cargo.toml)
if [ -z "$BIN" ]; then
  echo ":: error :: Cargo.toml 缺少 [package].name"
  exit 1
fi
export BIN
allvar BIN
mkdir -p outputs
'''

# ============================================================
#  唯一对外入口：mlmake build [<sys> <arch>]
# ============================================================
[[task]]
name = "构建"
value = "build"
cmduse = true
[task.settings]
actioninfo = false

[[task.step]]
name = "探测"
[[task.step.action]]
run = "task probe"

[[task.step]]
name = "设平台/架构变量"
[[task.step.action]]
run = '''
P="$1"
A="$2"
if [ -z "$P" ]; then
  export PLAT=current
  export ARCH=native
else
  export PLAT="$P"
  export ARCH="$A"
fi
allvar PLAT ARCH
'''

[[task.step]]
name = "调用 平台.架构"
[[task.step.action]]
run = "task ${PLAT}.${ARCH}"

